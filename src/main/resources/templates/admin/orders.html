<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments :: pageHead('Đơn giỏ hàng')}"></head>
<body class="admin-body">
<header th:replace="~{fragments :: adminHeader}"></header>

<main class="container wide">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="card-box">
        <div class="title-row"><h1>Đơn giỏ hàng</h1></div>

        <div class="filters">
            <a th:href="@{/admin/orders}" th:classappend="${currentStatus == null} ? 'active'">Tất cả</a>
            <a th:each="s : ${statuses}" th:href="@{/admin/orders(status=${s})}" th:text="${s.viLabel}"
               th:classappend="${currentStatus == s} ? 'active'"></a>
        </div>

        <p class="muted" th:if="${#lists.isEmpty(orders)}">Chưa có đơn hàng nào.</p>

        <table class="table" th:unless="${#lists.isEmpty(orders)}">
            <thead>
            <tr><th>Mã đơn</th><th>Ngày đặt</th><th>Khách hàng</th><th>SĐT</th><th>SL</th>
                <th>Tổng tiền</th><th>Nhận hàng</th><th>Thanh toán</th><th>Trạng thái</th></tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td><a th:href="@{/admin/orders/{id}(id=${o.id})}" th:text="${o.code}"></a></td>
                <td class="small" th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${o.customerName}"></td>
                <td th:text="${o.phone}"></td>
                <td th:text="${o.totalQuantity}"></td>
                <td th:text="${#numbers.formatInteger(o.total, 1, 'POINT')} + '₫'"></td>
                <td class="small" th:text="${o.receivingMethod != null} ? ${o.receivingMethod.viLabel} : ''"></td>
                <td class="small" th:text="${o.paymentMethod.label}"></td>
                <td><span th:class="'status ' + ${o.status.name().toLowerCase()}" th:text="${o.status.viLabel}"></span></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
