spring.application.name=bookorder
server.port=8080
# Neu muon chay duoi duong dan con (vd: tensach.vn/order) thi bo comment dong duoi
# server.servlet.context-path=/order

# ===== CSDL H2 (luu vao thu muc ./data) =====
spring.datasource.url=jdbc:h2:file:./data/bookorder;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# ===== Neu dung MySQL: comment khoi H2 o tren, bo comment khoi nay =====
# spring.datasource.url=jdbc:mysql://localhost:3306/bookorder?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
# spring.datasource.username=root
# spring.datasource.password=matkhau
# spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ===== Tai khoan quan tri (DOI TRUOC KHI DUA LEN MANG) =====
app.admin.username=admin
app.admin.password=admin123

# ===== Thong tin cua hang (hien tren trang) =====
app.shop.name=Linery Bookstore
app.shop.main-site-url=https://linerybookstore2.pages.dev
app.shop.hotline=0900 000 000
app.shop.shipping-fee=30000
app.shop.free-shipping-from=300000
app.shop.bank-info=Vietcombank - 0123456789 - LINERY BOOKSTORE
# Ma giam gia: MA:phan-tram, cach nhau dau phay
app.shop.vouchers=WELCOME10:10,LINERY15:15

# ===== Order theo link =====
# Gia order = gia bia (doi ra VND) x price-percent / 100   (85 = gia bia -15%)
app.link.price-percent=85
# Ty gia doi ra VND (MA_TIEN:so_dong). VND luon = 1
app.currency.rates=USD:26000,GBP:35000
# COD: coc truoc deposit-percent % GIA BIA, phan con lai tra khi nhan sach
app.link.deposit-percent=50
# Phi ship khi chon COD + giao hang (chuyen khoan toan bo thi mien phi ship)
app.link.cod-shipping-fee=30000

# Doc gia du phong bang Chrome chay ngam (khi trang chan doc thuong, vd Amazon)
app.link.browser.enabled=true
# chrome = dung Google Chrome da cai tren may; msedge = Microsoft Edge
app.link.browser.channel=chrome
# Lam tron gia order / tien coc len boi so nay (1000 = chan nghin; 1 = khong lam tron)
app.link.round-to=1000
# Dung Chrome cho moi trang (true) hay chi cac trang trong app.link.browser.domains (false)
app.link.browser.all-domains=true
# Bi trang chong bot chan (Cloudflare...) thi thu lai bang Chrome co cua so dat ngoai man hinh
app.link.browser.retry-with-window=true
